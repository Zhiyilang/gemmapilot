# GemmaPilot — root coder agent
# Competition: Google Gemma 4 Developer Agent Competition (Kaggle)
# Config language: Google ADK Agent Config (adk.dev/agents/config) + competition restrictions.
#
# HARD RULES COMPLIANCE:
#  - All agents/subagents must use the SAME base model.
#  - Only the 9 harness tools + sub-agents via agent_tool are allowed.
#  - Do NOT declare run_skill_script / load_skill_resource as tools (not in the closed
#    ToolRegistry -> compile failure). Custom logic ships as skill SCRIPTS and is
#    invoked via run_command inside the sandbox.
#  - No path traversal (../ or symlinks) outside the submission root.

agent_class: LlmAgent
name: gemmapilot_coder
model: gemma-4-31b-it-qat-w4a16-ct
adapter: main_lora                 # optional: adapters/main_lora/ (PEFT, safetensors)

description: >
  Autonomous software-engineering agent. Localizes root cause via the code graph,
  reproduces the failure, applies a minimal patch, and verifies with tests before
  calling submit_patch.

instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml

tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - submit_patch
  - get_status
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true

skills:
  - skills/repo_navigate
  - skills/reproduce
  - skills/patch
  - skills/verify
